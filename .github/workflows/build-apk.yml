name: Build APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Опубликовать как обновление для приложения'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка зависимостей
        run: npm install

      - name: Номер сборки для приложения
        run: echo "window.BUILD = ${{ github.run_number }};" > www/build.js

      - name: Постоянный ключ подписи (если задан секрет)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null
          fi

      - name: Android-проект
        run: |
          npx cap add android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"build-${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Сборка APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dz-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Опубликовать релиз
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
