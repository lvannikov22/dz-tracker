name: Build APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Опубликовать как обновление для приложения'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка зависимостей
        run: npm install

      - name: Номер сборки для приложения
        run: echo "window.BUILD = ${{ github.run_number }};" > www/build.js

      - name: Постоянный ключ подписи
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i fingerprint
          else
            echo "СЕКРЕТ НЕ ЗАДАН"
          fi

      - name: Android-проект
        run: |
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx @capacitor/assets@3 generate --android
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_dz.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF"
                android:pathData="M19,3H5C3.89,3 3,3.9 3,5v14c0,1.1 0.89,2 2,2h14c1.11,0 2,-0.9 2,-2V5C21,3.9 20.11,3 19,3zM10,17l-5,-5l1.41,-1.41L10,14.17l7.59,-7.59L19,8L10,17z"/>
          </vector>
          EOF
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"build-${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Сборка APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Подпись постоянным ключом и проверка
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          IN=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -z "$KS" ]; then
            echo "Секрета нет, APK остаётся с ключом Gradle"
            cp "$IN" app-debug.apk
            exit 0
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android --out app-debug.apk "$IN"
          echo "=== Ключ, которым подписан итоговый APK ==="
          "$BT/apksigner" verify --print-certs app-debug.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: dz-tracker-apk
          path: app-debug.apk

      - name: Опубликовать релиз
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: app-debug.apk
