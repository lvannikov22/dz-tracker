<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#faf8ff">
  <title>ДЗ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="screen"></main>

  <form id="quick" autocomplete="off">
    <div id="qprev"></div>
    <div class="qrow">
      <input id="qin" type="text" placeholder="html - сверстать форму до пт" enterkeyhint="done">
      <button type="submit" aria-label="Добавить">+</button>
    </div>
  </form>

  <nav id="nav">
    <button data-tab="today">☀️<span>Сегодня</span></button>
    <button data-tab="week">📅<span>Неделя</span></button>
    <button data-tab="points">⭐<span>Баллы</span></button>
    <button data-tab="grades">🎓<span>Оценки</span></button>
  </nav>

  <div id="sheet" hidden></div>
  <script src="app.js"></script>
</body>
</html>
